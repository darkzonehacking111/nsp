# ============================================================
# GAMESMANIA DATABASE CONFIGURATION
# ============================================================
#
# Supported database types:
#   db.type=auto    -> Tries MySQL first, smoothly falls back to SQLite
#   db.type=mysql   -> Forces MySQL connection
#   db.type=sqlite  -> Uses local SQLite file (gamesmania.db)
#
# ============================================================

db.type=auto

# MySQL Configuration
db.host=localhost
db.port=3306
db.name=gamesmania
db.user=root
db.password=

# SQLite Configuration (Used automatically as fallback)
db.sqlite.file=gamesmania.db
